services:
  ground-robot:
    build:
      context: .
      dockerfile: Dockerfile

    network_mode: host

    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /root/.Xauthority
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      OLLAMA_HOST: "http://127.0.0.1:11434"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro

    stdin_open: true
    tty: true
